[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-launch-forensics"
version = "0.1.0"
description = "Read-only forensics for pump.fun style token launches"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "solana-launch-forensics contributors" }]
keywords = ["solana", "pump.fun", "forensics", "onchain", "spl-token"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
launchforensics = "launchforensics.cli:main"

[tool.setuptools.packages.find]
include = ["launchforensics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
