[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-launch-forensics"
version = "0.3.2"
description = "Read-only forensics for pump.fun style token launches"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tdkrHuang" }]
keywords = ["solana", "pump.fun", "forensics", "onchain", "spl-token"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tdkrHuang/solana-launch-forensics"
Repository = "https://github.com/tdkrHuang/solana-launch-forensics"
Issues = "https://github.com/tdkrHuang/solana-launch-forensics/issues"
Changelog = "https://github.com/tdkrHuang/solana-launch-forensics/releases"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
launchforensics = "launchforensics.cli:main"

[tool.setuptools.packages.find]
include = ["launchforensics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
